<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Liminal Platform</title>
  <link rel="stylesheet" href="liminal.css">
  <link rel="stylesheet" href="platform.css">
</head>
<body>
  <script src="theme.js"></script>  <!-- first: the page painted in the UI's theme at once -->
  <script src="touch.js"></script>  <!-- right after it: a finger, a pen and the on-screen keyboard (liminal-libs 1.42.0) -->
  <div class="app-page">
    <main class="app-main cols" id="main" aria-live="polite">
      <nav class="app-list" id="list" aria-label="This machine and its plugins"></nav>
      <section class="app-data" id="data" aria-label="What the selected one shows"></section>
      <aside class="app-side" id="side" aria-label="The selected one's specifics"></aside>
    </main>
    <nav id="rail" aria-label="Platform">
      <button type="button" id="railChip" class="master active" data-select="machine" title="Platform: this machine"></button>
    </nav>
  </div>
  <script src="icons.js"></script>
  <script src="menu.js"></script>
  <script src="charts.js"></script>
  <script src="apis.js"></script>  <!-- the API each plugin attaches to, drawn on its page (liminal-libs 1.49.0) -->
  <script src="terminal.js"></script>
  <script src="platform.js"></script>
</body>
</html>
