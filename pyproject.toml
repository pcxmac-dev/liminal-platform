[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liminal-platform"
version = "0.2.0"  # the platform app's own release (CHANGELOG.md)
description = "The Liminal platform: the interface to the software and hardware under the framework, with its machine plugins (WSL distributions with Docker inside), the Docker instances and the AI assistants."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["liminal-libs>=1.23.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
liminal-platform = "liminal_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liminal_platform = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
