[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liminal-platform"
version = "0.42.1"  # the platform app's own release (CHANGELOG.md)
description = "The Liminal platform: the interface to the software and hardware under the framework, with its machine plugins (WSL distributions with Docker inside), the Docker instances and the AI assistants."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["liminal-libs>=1.103.0"]  # 0.36.0: the platform core (apps/platform.py); 0.40.0: needs.py, facts.py, PLATFORM_KINDS

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
liminal-platform = "liminal_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liminal_platform = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
